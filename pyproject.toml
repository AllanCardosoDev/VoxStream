[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "voxstream"
version     = "1.0.0"
description = "Gerador de voz multilíngue com IA usando Streamlit e Coqui TTS"
readme      = "README.md"
license     = { file = "LICENSE" }
authors     = [{ name = "AllanCardosoDev" }]
requires-python = ">=3.11"
keywords    = ["tts", "voice", "streamlit", "ai", "speech-synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "streamlit>=1.32.0",
    "TTS>=0.22.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage   = "https://github.com/AllanCardosoDev/VoxStream"
Repository = "https://github.com/AllanCardosoDev/VoxStream.git"
Issues     = "https://github.com/AllanCardosoDev/VoxStream/issues"

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxstream*"]
