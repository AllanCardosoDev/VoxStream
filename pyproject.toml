[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxstream"
version = "1.0.0"
description = "Gerador de voz multilíngue com IA usando Streamlit e Coqui TTS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "AllanCardosoDev" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.2",
    "TTS>=0.22.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
